<div class="border-top-thin clearfix mt-2 mt-lg-4">
    <div class="container mx-auto px-2">
      <p class="col-8 sm-width-full left py-2 mb-0">This site is maintained by <a class="text-accent" href="https://github.com/{{ site.github_username }}">{{ site.github_username }}</a></p>
      <ul class="list-reset right clearfix sm-width-full py-2 mb-2 mb-lg-0">
        <li class="inline-block mr-1">
            <a href="mailto:david@davidpait.io" class="button" >Contact</a>
          </li>
        <li class="inline-block">
          <a class="github-button" href="https://github.com/{{ site.github_username }}/{{ site.github_repo }}" data-icon="octicon-star" data-count-href="{{ site.github_username }}/{{ github_repo }}/stargazers" data-count-api="/repos/{{ site.github_username }}/{{ github_repo }}#stargazers_count" data-count-aria-label="# stargazers on GitHub" aria-label="Star {{ site.github_username }}/{{ github_repo }} on GitHub">Star</a>
        </li>
      </ul>
    </div>
  </div>

  <script>
  document.addEventListener("DOMContentLoaded", function () {
    // Track external link clicks
    document.querySelectorAll('a[href^="http"]').forEach(function (link) {
      if (link.hostname !== window.location.hostname) {
        link.addEventListener("click", function () {
          if (typeof pendo !== "undefined") {
            pendo.track("External Link Clicked", {
              link_url: link.href,
              link_text: (link.textContent || "").trim().substring(0, 100),
              page_path: window.location.pathname
            });
          }
        });
      }
    });

    // Track contact email link clicks
    document.querySelectorAll('a[href^="mailto:"]').forEach(function (link) {
      link.addEventListener("click", function () {
        if (typeof pendo !== "undefined") {
          pendo.track("Contact Clicked", {
            page_path: window.location.pathname
          });
        }
      });
    });
  });
  </script>
