<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
  
    <title>{% if page.title %}{{ page.title | escape }}{% else %}{{ site.title | escape }}{% endif %}</title>
    <meta name="description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 160 }}{% else %}{{ site.description }}{% endif %}">
  
    {% assign user_url = site.url | append: site.baseurl %}
    {% assign full_base_url = user_url | default: site.github.url %}
    <link rel="stylesheet" href="{{ "/assets/style.css" | prepend: full_base_url }}">
    <link rel="shortcut icon" type="image/png" href="favicon.png">
  
    <link rel="canonical" href="{{ page.url | replace:'index.html','' | prepend: site.baseurl | prepend: site.url }}">
    <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ "/feed.xml" | prepend: site.baseurl | prepend: site.url }}">
  
    <script async defer src="https://buttons.github.io/buttons.js"></script>

    <!-- Pendo Track Events: outbound and contact link clicks -->
    <script>
      document.addEventListener('DOMContentLoaded', function () {
        if (typeof pendo === 'undefined' || typeof pendo.track !== 'function') return;

        // Track outbound link clicks (external http/https links)
        document.querySelectorAll('a[href^="http"]').forEach(function (link) {
          if (link.hostname === window.location.hostname) return;

          link.addEventListener('click', function () {
            pendo.track('Outbound Link Clicked', {
              link_url: link.href,
              link_text: (link.textContent || '').trim().substring(0, 100),
              page_path: window.location.pathname
            });
          });
        });

        // Track contact (mailto) link clicks
        document.querySelectorAll('a[href^="mailto:"]').forEach(function (link) {
          link.addEventListener('click', function () {
            pendo.track('Contact Link Clicked', {
              page_path: window.location.pathname
            });
          });
        });
      });
    </script>
  </head>
